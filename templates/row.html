<div class="leave-row"><div><strong>{{ r.staff.name }}</strong><span class="role">{{ r.staff.get_role_display }}</span></div><div><span class="badge {{ r.kind }}">{{ r.get_kind_display }}</span> {{ r.leave_type.name }}{% if r.kind == 'TIME' %}<span>{{ r.start|time:'H:i' }}〜{{ r.end|time:'H:i' }}</span>{% endif %}<small>実休暇 {{ r.minutes }}分</small></div>{% if r.staff_id == user.pk or user.is_staff %}<a href="{% url 'edit' r.pk %}">変更</a><a href="{% url 'cancel' r.pk %}">取消</a>{% endif %}</div>
